<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Animated encryption stream</title>
  <desc id="desc">A glowing lock with moving data particles and a flowing encrypted path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>

  <g opacity="0.18" stroke="#38bdf8" stroke-width="2">
    <path d="M80 70 H1120"/>
    <path d="M80 250 H1120"/>
    <path d="M120 30 V290"/>
    <path d="M1080 30 V290"/>
  </g>

  <g fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M220 172 C340 92, 470 92, 600 172 S860 252, 980 172">
      <animate attributeName="stroke-dasharray" values="0 900;120 780;0 900" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-900" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M220 172 C340 92, 470 92, 600 172 S860 252, 980 172" stroke-opacity="0.35" stroke-width="14" filter="url(#blur)"/>
  </g>

  <g transform="translate(480 84)">
    <rect x="48" y="88" width="144" height="120" rx="24" fill="url(#lock)" />
    <path d="M84 94v-20c0-31 25-56 56-56s56 25 56 56v20" fill="none" stroke="#cbd5e1" stroke-width="20" stroke-linecap="round"/>
    <circle cx="120" cy="148" r="14" fill="#0f172a"/>
    <path d="M120 162 v28" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    <rect x="110" y="162" width="20" height="42" rx="10" fill="#0f172a"/>
    <animateTransform attributeName="transform" type="translate" values="480 84;480 80;480 84" dur="3s" repeatCount="indefinite"/>
  </g>

  <g fill="#22d3ee">
    <circle cx="220" cy="172" r="7">
      <animateMotion dur="4s" repeatCount="indefinite" rotate="auto">
        <mpath href="#"/>
      </animateMotion>
    </circle>
  </g>

  <g fill="#22d3ee">
    <circle cx="0" cy="0" r="6">
      <animateMotion dur="4s" repeatCount="indefinite" path="M220 172 C340 92, 470 92, 600 172 S860 252, 980 172" begin="0s"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#a855f7">
      <animateMotion dur="4s" repeatCount="indefinite" path="M220 172 C340 92, 470 92, 600 172 S860 252, 980 172" begin="1.1s"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#22c55e">
      <animateMotion dur="4s" repeatCount="indefinite" path="M220 172 C340 92, 470 92, 600 172 S860 252, 980 172" begin="2.2s"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#60a5fa">
      <animateMotion dur="4s" repeatCount="indefinite" path="M220 172 C340 92, 470 92, 600 172 S860 252, 980 172" begin="3.0s"/>
    </circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="26" fill="#94a3b8" opacity="0.85">
    <text x="95" y="110">10100101</text>
    <text x="92" y="145">01101001</text>
    <text x="92" y="180">11001010</text>
    <text x="92" y="215">00111101</text>
    <text x="980" y="110">cipher()</text>
    <text x="980" y="145">encrypt()</text>
    <text x="980" y="180">secure()</text>
    <text x="980" y="215">decode()</text>
  </g>

  <g opacity="0.75">
    <circle cx="600" cy="160" r="108" fill="none" stroke="url(#glow)" stroke-width="2" stroke-dasharray="10 14">
      <animateTransform attributeName="transform" type="rotate" from="0 600 160" to="360 600 160" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="160" r="132" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="2 18">
      <animateTransform attributeName="transform" type="rotate" from="360 600 160" to="0 600 160" dur="24s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>